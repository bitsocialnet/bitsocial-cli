# Temporary measurement harness for issue #136. Delete once #136 is fixed.
#
# Round 3. Ruled out so far, on windows runners:
#   - resolution      : dry-run resolve is 11-12s
#   - postinstalls    : --ignore-scripts is no faster (8.3m)
#   - npm version     : 12.0.2 is no faster (10.8m)
#   - network         : --offline SUCCEEDS (exit 0) in 10m, so the whole cost
#                       is local work against an already-warm cache
#
# Round 2 tried to move the global prefix to D: but `npm config set prefix`
# silently lost to setup-node's npm_config_prefix env var - the log shows
# "prefix now: C:\npm\prefix". So that theory is UNTESTED, not disproven.
# Here the prefix is forced with the --prefix flag and asserted before use.
#
# Reference points, same job, same runner:
#   npm ci               2054 packages -> D: workspace  in ~55s
#   npm install -g       1386 packages -> C:\npm\prefix in ~10m
name: CI windows install experiment

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/windows-global-install-136'

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Rounds 1 and 2 each had exactly one job land at ~25.6m while its
      # siblings sat at 8-11m. Serialise so contention cannot be the story.
      max-parallel: 1
      matrix:
        include:
          # Control.
          - variant: control
            mode: global-default
          # Does the destination volume explain it? C: is the default prefix;
          # D: is where npm ci writes the same tree in under a minute.
          - variant: prefix-d
            mode: global-prefix-d
          # Isolates "global install" from "installing a tarball spec". Same
          # tarball, same resolve, ordinary project install on D:.
          - variant: local-d
            mode: local-d

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - run: corepack enable npm && corepack prepare npm@11.13.0 --activate
        shell: bash

      - name: npm ci (with retry)
        shell: bash
        run: |
          start=$(date +%s)
          for attempt in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "TIMING npm-ci $(( $(date +%s) - start ))s"

      - run: npm run build
      - run: npx oclif manifest

      - name: Pack
        shell: bash
        run: |
          TARBALL=$(npm pack --silent | tail -1)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "packed $TARBALL"
          echo "default prefix=$(npm config get prefix)"
          echo "cache=$(npm config get cache)"
          echo "npm_config_prefix env=${npm_config_prefix:-<unset>}"

      - name: Install (timed)
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          FLAGS="--prefer-offline --no-audit --no-fund"
          case "${{ matrix.mode }}" in
            global-default)
              TARGET="default C:\\npm\\prefix"
              start=$(date +%s)
              npm install -g $FLAGS "./$TARBALL"; code=$?
              ;;
            global-prefix-d)
              mkdir -p /d/npm-global
              # --prefix on the command line beats npm_config_prefix, which is
              # what defeated round 2. Assert it actually moved before timing.
              echo "asserting prefix: $(npm config get prefix --prefix /d/npm-global)"
              TARGET="D:\\npm-global"
              start=$(date +%s)
              npm install -g --prefix /d/npm-global $FLAGS "./$TARBALL"; code=$?
              ;;
            local-d)
              mkdir -p /d/localinst && cd /d/localinst
              npm init -y >/dev/null 2>&1
              TARGET="D: local project"
              start=$(date +%s)
              npm install $FLAGS "$GITHUB_WORKSPACE/$TARBALL"; code=$?
              ;;
          esac
          echo "TIMING install variant=${{ matrix.variant }} target=$TARGET $(( $(date +%s) - start ))s exit=$code"

      - name: Where did it land
        if: always()
        shell: bash
        run: |
          echo "C:\\npm\\prefix  : $(ls -1 /c/npm/prefix/node_modules 2>/dev/null | wc -l) entries"
          echo "D:\\npm-global   : $(ls -1 /d/npm-global/node_modules 2>/dev/null | wc -l) entries"
          echo "D:\\localinst    : $(ls -1 /d/localinst/node_modules 2>/dev/null | wc -l) entries"
