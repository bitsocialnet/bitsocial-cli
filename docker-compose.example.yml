# Example Docker Compose for bitsocial-cli
#
# Quick start:
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#
# View logs (includes RPC auth key URL):
#   docker compose logs -f
#
# Access web UI:
#   Open the URL printed in logs, e.g.:
#   http://localhost:9138/seedit                (local connections only)
#   http://<your-ip>:9138/<auth-key>/seedit     (remote connections)

services:
  bitsocial:
    image: ${BITSOCIAL_IMAGE:-ghcr.io/bitsocialnet/bitsocial-cli:latest}
    container_name: bitsocial
    restart: unless-stopped
    ports:
      - "9138:9138"      # Plebbit RPC + Web UI
      - "50019:50019"    # Kubo IPFS API
      - "6473:6473"      # IPFS Gateway
      - "4001:4001"      # Kubo Swarm (TCP)
      - "4001:4001/udp"  # Kubo Swarm (QUIC + WebTransport + WebRTC-direct)
    volumes:
      - bitsocial-data:/data
      - bitsocial-logs:/logs
    # Increase UDP buffer limits for QUIC transport (used by Kubo/IPFS).
    # Prevents: "failed to sufficiently increase receive buffer size" warning.
    sysctls:
      - net.core.rmem_max=7500000
      - net.core.wmem_max=7500000
    environment:
      - DEBUG=bitsocial*, pkc*, -pkc*trace

      # Set a fixed RPC auth key instead of a random one.
      # Useful for bookmarking the web UI URL or scripting RPC access.
      # If left unset, a random key is generated (visible in `docker compose logs`).
      # - PKC_RPC_AUTH_KEY=your-custom-auth-key-here

      # Override Kubo IPFS bind addresses / ports:
      # - KUBO_RPC_URL=http://0.0.0.0:50019/api/v0
      # - IPFS_GATEWAY_URL=http://0.0.0.0:6473

    # # Uncomment to build from source instead of pulling the image:
    # build:
    #   context: .
    #   args:
    #     GITHUB_TOKEN: ${GITHUB_TOKEN:-}

    # # Optional: a browser address through Tailscale Funnel, for a node behind NAT
    # # with no port forwarding. Read docs/tailscale-funnel.md first. To use it:
    # #   1. Uncomment the line below, and the `tailscale` service and `configs` further down.
    # #   2. Move the `ports:` list above from this service to the `tailscale` service.
    # #   3. Put TS_AUTHKEY=tskey-auth-... in a `.env` file next to this one.
    # #   4. After `docker compose up -d`, run:
    # #      docker compose exec bitsocial bitsocial reachability setup --announce /dns4/<machine>.<tailnet>.ts.net/tcp/443/tls/ws
    # network_mode: service:tailscale

  # # Optional Tailscale sidecar (see above). The bitsocial service shares its network,
  # # so Tailscale can forward to kubo's 127.0.0.1:4002 listener.
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   # The machine name. It becomes public for good, so pick one you do not mind publishing.
  #   hostname: bitsocial-node
  #   restart: unless-stopped
  #   environment:
  #     - TS_AUTHKEY=${TS_AUTHKEY:-}
  #     - TS_STATE_DIR=/var/lib/tailscale
  #     - TS_SERVE_CONFIG=/tailscale-serve.json
  #   configs:
  #     - tailscale-serve.json
  #   volumes:
  #     - tailscale-state:/var/lib/tailscale

# # Optional, for the Tailscale sidecar: turns Funnel on and forwards it to kubo.
# # 4002 is the port `bitsocial reachability setup` prints. Change it if yours differs.
# configs:
#   tailscale-serve.json:
#     content: |
#       {
#         "TCP": { "443": { "HTTPS": true } },
#         "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://127.0.0.1:4002" } } } },
#         "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": true }
#       }

volumes:
  bitsocial-data:
  bitsocial-logs:
  # tailscale-state:   # optional, for the Tailscale sidecar
